{% extends "base.html" %}
{% block title %}Formulario de Entrenador{% endblock title %}
{% block content %}
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_div }}
    <div class="d-grid gap-3 d-md-flex justify-content-center mt-3">
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="{% url 'pokedex:index' %}" class="btn btn-secondary">Regresar</a>
    </div>
</form>
{% endblock content %}
